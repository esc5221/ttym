[package]
name = "ttym-native"
version = "0.1.0"
description = "Local native shell for ttym"
authors = ["OpenAI Codex"]
edition = "2021"

[lib]
name = "ttym_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
