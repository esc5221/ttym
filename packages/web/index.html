<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ttym</title>
  <style>
    /* 두 글자만 든 476바이트 폰트. unicode-range가 있으니 그 두 코드포인트를
       만날 때만 내려받는다.

       왜 필요한가: 안드로이드에는 U+23FA(⏺)·U+23F5(⏵)를 가진 고정폭 폰트가 없다.
       U+23FA는 컬러 이모지로 폴백해 1.96셀 폭이 되어 다음 칸을 덮고, U+23F5는
       글리프가 없어 빈칸이 된다(S24+ 실측). 둘 다 Claude Code가 쓰는 기호다.
       유니코드상 둘 다 Neutral(1셀)이라 xterm 계산은 맞고 폰트만 없는 상황이라,
       0.5em advance로 직접 그려 넣었다. scripts/build-glyph-font.mjs 참고. */
    @font-face {
      font-family: "ttym glyphs";
      src: url("/ttym-glyphs.woff2?v=1") format("woff2");
      unicode-range: U+23FA, U+23F5;
      font-display: block;
    }
    /* D2Coding은 맥 외 플랫폼에서만 JS가 FontFace로 등록 — 맥에선 스택에서 건너뛰어진다. */
    :root { --mono: "ttym glyphs", Menlo, Monaco, D2Coding, "Cascadia Mono", Consolas, monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; transition: none !important; animation: none !important; }
      .agent-dot-run { animation: agent-pulse 1.4s ease-in-out infinite !important; }
      /* 행동 버튼은 hover에서만 — 상태 표시(점·bell)는 항상 보인다. */
      .reveal { opacity: 0; pointer-events: none; transition: opacity .12s ease !important; }
      .reveal-parent:hover .reveal { opacity: 1; pointer-events: auto; }
      /* 터치엔 hover가 없다 — hover 전용 액션은 coarse pointer에서 상시 노출 */
      @media (pointer: coarse) {
        .reveal { opacity: 1; pointer-events: auto; }
      }
      /* 명령 점프 착지 펄스 — 전역 transition:none의 화이트리스트 예외 */
      .jump-flash { transition: opacity 160ms ease-in !important; }
      .jump-flash.jump-flash-out { transition: opacity 600ms ease-out !important; }
      .morph-hl { transition: top .18s cubic-bezier(.2,.8,.25,1), left .18s cubic-bezier(.2,.8,.25,1), width .18s cubic-bezier(.2,.8,.25,1), height .18s cubic-bezier(.2,.8,.25,1), opacity .15s ease, background .18s ease, border-color .18s ease, border-radius .18s ease !important; }
      @keyframes agent-pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    html, body { min-height: 100%; background: var(--bg0, #1e1e1e); overflow-x: hidden; overflow-y: auto; }
    #root { min-height: 100%; background: var(--bg0, #1e1e1e); }
    .xterm-viewport::-webkit-scrollbar { display: none; }
    .xterm-viewport { scrollbar-width: none; }
    /* 탭 스크롤러: 스크롤바 자체를 없앤다 — 넘침은 양끝 페이드가 말한다. */
    .tab-scroller { overflow-x: auto; scrollbar-width: none; }
    .tab-scroller::-webkit-scrollbar { display: none; }
    /* 스크롤 컨테이너용 얇은 스크롤바 — 평소엔 안 보이고 리스트에 호버할 때만 썸이 뜬다. */
    .thin-scroll::-webkit-scrollbar { width: 6px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
    .thin-scroll:hover::-webkit-scrollbar-thumb { background: var(--line-strong, #3c3c3c); }
    .thin-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-dim, #6e6e6e); }
    .preview-scroll::-webkit-scrollbar { display: none; }
    .preview-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
